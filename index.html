<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>컨셉 컬러 프리뷰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  /* Left rail = block palette, selected-block properties, canvas settings, 2-color picker.
     Right = a mobile phone whose screen is a free drag-and-resize canvas; blocks place
     side-by-side or stacked, overflow scrolls both ways. Accents use --primary/--secondary
     (grayscale when color is toggled off). Tool chrome is theme-aware. */
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --panel-2:#fafbfc; --fg:#1a1d21;
    --muted:#71777e; --faint:#9aa0a7; --border:#e4e7eb; --border-strong:#d2d7dd;
    --sel:#eef2f6; --ring:#111418; --radius:13px;
    --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --app-surface:#e4e7ec; --app-line:#e7eaee; --app-ink:#1b1f24; --app-ph:#b9c0c8; --app-skel:#d6dbe1;
    --primary:#4f46e5; --secondary:#f59e0b;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#121417; --panel:#1b1e22; --panel-2:#20242a; --fg:#e9ebee; --muted:#9aa1a9;
    --faint:#767d85; --border:#2b3036; --border-strong:#3a4047; --sel:#262b32; --ring:#eef1f5; color-scheme:dark;}}
  :root[data-theme="dark"]{
    --bg:#121417; --panel:#1b1e22; --panel-2:#20242a; --fg:#e9ebee; --muted:#9aa1a9;
    --faint:#767d85; --border:#2b3036; --border-strong:#3a4047; --sel:#262b32; --ring:#eef1f5; color-scheme:dark;}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}

  .app{display:flex;gap:20px;align-items:flex-start;min-height:100%;max-width:1160px;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px}

  /* ---- left rail ---- */
  .rail{flex:0 0 320px;width:320px;display:flex;flex-direction:column;gap:14px}
  .brand h1{margin:0;font-size:1.08rem;font-weight:800;letter-spacing:-.02em}
  .brand p{margin:2px 0 0;font-size:.76rem;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
  .lbl{display:flex;align-items:center;justify-content:space-between;font-size:.66rem;font-weight:700;
    letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 11px}

  .palette{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .pal{display:flex;align-items:center;gap:8px;cursor:grab;background:var(--panel-2);border:1px solid var(--border);
    border-radius:10px;padding:8px 9px;color:var(--fg);font-family:inherit;font-size:.76rem;font-weight:600;
    user-select:none;touch-action:none;transition:background .12s,border-color .12s}
  .pal:hover{background:var(--sel);border-color:var(--border-strong)}
  .pal:active{cursor:grabbing}
  .pal .pic{flex:0 0 22px;height:22px;border-radius:6px;background:var(--panel);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted)}
  .pal .pic svg{width:14px;height:14px}
  .templates{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .tpl{display:flex;flex-direction:column;gap:1px;align-items:flex-start;cursor:pointer;background:var(--panel-2);
    border:1px solid var(--border);border-radius:10px;padding:8px 10px;color:var(--fg);font-family:inherit;text-align:left;transition:background .12s,border-color .12s}
  .tpl:hover{background:var(--sel);border-color:var(--border-strong)}
  .tpl b{font-size:.78rem;font-weight:700}
  .tpl span{font-size:.65rem;color:var(--muted)}
  .savebtn{flex:0 0 auto;border:1px solid var(--border);background:var(--panel-2);color:var(--fg);font-family:inherit;font-weight:700;font-size:.76rem;border-radius:8px;padding:0 13px;height:32px;cursor:pointer}
  .savebtn:hover{background:var(--sel);border-color:var(--border-strong)}
  .saved{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .sv{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:6px 10px}
  .sv b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.76rem;font-weight:700}
  .sv button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;font-size:.72rem;font-weight:700;padding:2px 3px}
  .sv button:hover{color:var(--fg)}
  .sv .svdel:hover{color:#e5484d}
  .saved-empty{font-size:.72rem;color:var(--muted)}

  .hint{font-size:.72rem;color:var(--muted);line-height:1.4}
  .prop{display:flex;flex-direction:column;gap:11px}
  .prow{display:flex;align-items:center;gap:9px}
  .prow > .k{flex:0 0 52px;font-size:.72rem;font-weight:700;color:var(--muted)}
  .field{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
  .num{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--panel-2);height:30px;flex:1;min-width:0}
  .num button{width:26px;height:100%;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;font-weight:700;flex:0 0 26px}
  .num button:hover{color:var(--fg);background:var(--sel)}
  .num input{flex:1;min-width:0;border:0;background:transparent;text-align:center;color:var(--fg);font-family:var(--mono);font-size:.78rem;font-weight:600;outline:none}
  .seg{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;flex:1}
  .seg button{flex:1;border:0;background:var(--panel-2);color:var(--muted);font-family:inherit;font-size:.72rem;font-weight:700;padding:7px 0;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ring);color:var(--panel)}
  .ptext{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);color:var(--fg);
    font-family:inherit;font-size:.8rem;padding:7px 9px;outline:none}
  .ptext:focus{border-color:var(--ring)}
  .del{width:100%;border:1px solid #e5484d44;background:#e5484d14;color:#e5484d;font-family:inherit;font-weight:700;
    font-size:.78rem;border-radius:9px;padding:8px;cursor:pointer;margin-top:2px}
  .del:hover{background:#e5484d22}

  .swrow{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .swrow:last-child{margin-bottom:0}
  .swatch{position:relative;flex:0 0 38px;width:38px;height:38px;border-radius:9px;border:1px solid rgba(0,0,0,.14);overflow:hidden;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .swatch input[type=color]{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);border:0;padding:0;cursor:pointer;background:transparent}
  .cmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .cmeta .role{font-size:.76rem;font-weight:700}
  .hexwrap{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--panel-2);height:30px}
  .hexwrap .hash{padding:0 1px 0 9px;color:var(--faint);font-family:var(--mono);font-size:.78rem}
  .hexwrap input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-family:var(--mono);font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:0 9px 0 2px;outline:none;height:100%}
  .hexwrap.bad{border-color:#e5484d}
  .colhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .colhead .lbl{margin:0}
  .switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:.72rem;font-weight:700;color:var(--muted)}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .track{width:36px;height:21px;border-radius:999px;background:var(--border-strong);position:relative;transition:background .15s}
  .track::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
  .switch input:checked + .track{background:#3ba55d}
  .switch input:checked + .track::after{transform:translateX(15px)}
  .colors.off{opacity:.42}

  /* ---- right stage ---- */
  .stage{flex:1;min-width:0;border:1px solid var(--border);border-radius:var(--radius);padding:22px 16px 26px;
    display:flex;flex-direction:column;align-items:center;gap:13px;overflow-x:auto;
    background:repeating-linear-gradient(0deg,transparent,transparent 23px,color-mix(in srgb,var(--border) 42%,transparent) 23px,color-mix(in srgb,var(--border) 42%,transparent) 24px),
      repeating-linear-gradient(90deg,transparent,transparent 23px,color-mix(in srgb,var(--border) 42%,transparent) 23px,color-mix(in srgb,var(--border) 42%,transparent) 24px)}
  .stage-top{display:flex;align-items:center;justify-content:space-between;width:300px;max-width:100%;gap:10px}
  .stage-top .now{font-size:.8rem;font-weight:700}
  .stage-top .now span{color:var(--muted);font-weight:500}
  .clearbtn{font-size:.7rem;font-weight:700;color:var(--muted);border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:5px 11px;cursor:pointer;font-family:inherit}
  .clearbtn:hover{border-color:var(--border-strong);color:var(--fg)}

  .phone{flex:0 0 auto;width:300px;height:620px;background:#0e0f12;border-radius:40px;padding:11px;
    box-shadow:0 22px 50px -18px rgba(10,12,20,.55),0 3px 10px rgba(0,0,0,.18);border:1px solid #26282d}
  .screen{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;background:var(--canvas-bg,#fff)}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:98px;height:20px;background:#0e0f12;border-radius:0 0 13px 13px;z-index:8}
  .notch[hidden]{display:none}
  .punch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#0e0f12;z-index:8}
  .punch[hidden]{display:none}
  .sbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:9px 16px 6px;font-size:12px;font-weight:700;z-index:5;color:#1b1f24}
  .sbar.android{padding:8px 14px 6px;font-weight:500;font-size:12px}
  .sbar .sig{display:flex;align-items:center;gap:5px}

  .canvas{flex:1;min-height:0;overflow:auto;position:relative;scrollbar-width:thin}
  .canvas::-webkit-scrollbar{width:6px;height:6px}
  .canvas::-webkit-scrollbar-thumb{background:var(--app-skel);border-radius:3px}
  .sheet{position:relative;background:var(--canvas-bg,#fff)}

  .blk{position:absolute;cursor:grab;touch-action:none;display:flex;overflow:hidden;border-radius:7px}
  .blk.sel{outline:2px solid var(--primary);outline-offset:1px;cursor:grabbing;z-index:4}
  .blk .handle{position:absolute;right:-5px;bottom:-5px;width:13px;height:13px;border-radius:4px;background:var(--primary);
    border:2px solid #fff;cursor:nwse-resize;z-index:5;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .blk .rm{position:absolute;top:-9px;right:-9px;width:18px;height:18px;border-radius:50%;background:#e5484d;color:#fff;
    border:2px solid #fff;display:grid;place-items:center;cursor:pointer;z-index:5;font-size:11px;line-height:1}
  .blk .rm svg{width:9px;height:9px}
  /* block visuals */
  .b-title{font-weight:800;letter-spacing:-.02em;line-height:1.15;align-items:center;overflow-wrap:anywhere}
  .b-text{line-height:1.4;align-items:flex-start;color:var(--app-ink);overflow-wrap:anywhere}
  .b-button{align-items:center;justify-content:center;font-weight:700;border-radius:9px;text-align:center}
  .b-badge{align-items:center;justify-content:center;font-weight:800;border-radius:999px;letter-spacing:.03em}
  .b-image,.b-box{align-items:center;justify-content:center;color:var(--app-ph)}
  .b-image svg{width:26px;height:26px}
  .b-avatar{border-radius:50%;align-items:center;justify-content:center;color:#fff}
  .b-avatar svg{width:52%;height:52%;opacity:.8}
  .b-divider{align-items:center}

  .empty{position:absolute;inset:0;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;color:var(--app-ph);pointer-events:none}
  .empty svg{width:32px;height:32px}
  .empty b{color:var(--app-ink);font-size:13px;font-weight:700}
  .empty span{font-size:11px;max-width:170px}

  @media (max-width:860px){.app{flex-direction:column}.rail{flex:none;width:100%;order:2}.stage{order:1;width:100%}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><h1>컨셉 컬러 프리뷰</h1><p>블럭을 끌어다 화면을 만들고, 두 색을 입혀 컨셉을 확인하세요.</p></div>

    <div class="card">
      <div class="lbl">블럭 <span style="font-family:var(--mono);color:var(--muted);letter-spacing:0;text-transform:none">클릭·드래그</span></div>
      <div class="palette" id="palette"></div>
    </div>

    <div class="card">
      <div class="lbl">템플릿 <span style="font-family:var(--mono);color:var(--muted);letter-spacing:0;text-transform:none">선택해서 시작</span></div>
      <div class="templates" id="tpl-list"></div>
    </div>

    <div class="card">
      <div class="lbl">저장 <span style="font-family:var(--mono);color:var(--muted);letter-spacing:0;text-transform:none">내 디자인</span></div>
      <div class="prop">
        <div class="prow">
          <div class="field"><input class="ptext" id="save-name" placeholder="디자인 이름 (선택)"></div>
          <button class="savebtn" id="save-btn">저장</button>
        </div>
      </div>
      <div class="saved" id="saved-list"></div>
    </div>

    <div class="card">
      <div class="lbl">선택한 블럭</div>
      <div id="props"><div class="hint">블럭을 선택하면 크기·폰트·색·텍스트를 조절할 수 있어요.</div></div>
    </div>

    <div class="card">
      <div class="lbl">캔버스</div>
      <div class="prop">
        <div class="prow"><span class="k">배경색</span>
          <div class="field">
            <label class="swatch" style="flex:0 0 30px;width:30px;height:30px"><input type="color" id="bg-pick" value="#ffffff" aria-label="배경색"></label>
            <div class="hexwrap" id="hw-bg"><span class="hash">#</span><input type="text" id="hex-bg" value="FFFFFF" maxlength="6" spellcheck="false" aria-label="배경 HEX"></div>
          </div>
        </div>
        <div class="prow"><span class="k">상단바</span>
          <div class="seg" id="os-seg">
            <button data-os="ios" aria-pressed="true">iOS</button>
            <button data-os="android" aria-pressed="false">Android</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="colhead"><span class="lbl">컬러</span>
        <label class="switch"><input type="checkbox" id="color-toggle" checked><span class="track"></span><span id="toggle-state">ON</span></label>
      </div>
      <div class="colors" id="colors">
        <div class="swrow">
          <label class="swatch"><input type="color" id="pick-primary" value="#4f46e5" aria-label="Primary"></label>
          <div class="cmeta"><div class="role">Primary</div>
            <div class="hexwrap" id="hw-primary"><span class="hash">#</span><input type="text" id="hex-primary" value="4F46E5" maxlength="6" spellcheck="false" aria-label="Primary HEX"></div></div>
        </div>
        <div class="swrow">
          <label class="swatch"><input type="color" id="pick-secondary" value="#f59e0b" aria-label="Secondary"></label>
          <div class="cmeta"><div class="role">Secondary</div>
            <div class="hexwrap" id="hw-secondary"><span class="hash">#</span><input type="text" id="hex-secondary" value="F59E0B" maxlength="6" spellcheck="false" aria-label="Secondary HEX"></div></div>
        </div>
      </div>
    </div>
  </aside>

  <main class="stage">
    <div class="stage-top"><div class="now">VIEW <span id="count">0개</span></div><button class="clearbtn" id="clear">비우기</button></div>
    <div class="phone">
      <div class="screen" id="screen">
        <div class="notch" id="notch"></div>
        <div class="punch" id="punch" hidden></div>
        <div class="sbar" id="sbar"></div>
        <div class="canvas" id="canvas">
          <div class="sheet" id="sheet"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  var sheet=document.getElementById('canvas').querySelector('#sheet');
  var canvas=document.getElementById('canvas'), screen=document.getElementById('screen');
  var GRID=4;

  var ICON={
    title:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M9 7v11"/></svg>',
    text:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
    button:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="8" rx="4"/></svg>',
    badge:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="9" width="16" height="6" rx="3"/></svg>',
    image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg>',
    box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>',
    avatar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>',
    divider:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12h16"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };

  var TYPES={
    title:{label:'제목', w:200,h:34, minW:60,minH:22, text:'제목', size:22, textish:true, role:'neutral'},
    text:{label:'텍스트', w:200,h:52, minW:60,minH:24, text:'본문 텍스트가 들어갑니다.', size:13, textish:true, role:'neutral'},
    button:{label:'버튼', w:132,h:40, minW:60,minH:28, text:'버튼', size:13, textish:true, role:'primary'},
    badge:{label:'뱃지', w:62,h:24, minW:36,minH:18, text:'NEW', size:10, textish:true, role:'secondary'},
    image:{label:'이미지', w:150,h:108, minW:40,minH:40, role:'neutral'},
    box:{label:'박스', w:130,h:88, minW:28,minH:24, role:'neutral'},
    avatar:{label:'아바타', w:52,h:52, minW:24,minH:24, role:'neutral'},
    divider:{label:'구분선', w:220,h:3, minW:40,minH:2, maxH:14, role:'neutral'}
  };

  /* ---- color state ---- */
  function clean(h){return (h||'').replace(/[^0-9a-fA-F]/g,'').slice(0,6);}
  function isHex(h){return /^([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(h);}
  function expand(h){return h.length===3?h.split('').map(function(c){return c+c;}).join(''):h;}
  function contrast(h){var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
    function l(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);}
    var L=0.2126*l(r)+0.7152*l(g)+0.0722*l(b);return (1.05/(L+0.05))>=((L+0.05)/0.09)?'#ffffff':'#1b1f24';}
  var S={primary:'4F46E5', secondary:'F59E0B', on:true, bg:'FFFFFF', os:'ios'};
  function roleHex(role){
    if(role==='primary') return '#'+(S.on?S.primary:'3A3F46');
    if(role==='secondary') return '#'+(S.on?S.secondary:'9AA0A7');
    return null;
  }

  /* ---- blocks ---- */
  var blocks=[], seq=1, selId=null;
  function snap(v){return Math.round(v/GRID)*GRID;}

  function makeBlock(type,x,y){
    var t=TYPES[type];
    var b={id:seq++, type:type, x:snap(x), y:snap(y), w:t.w, h:t.h, role:t.role, size:t.size, text:t.text};
    blocks.push(b); return b;
  }

  function styleBlock(el,b){
    var t=TYPES[b.type];

    arr.forEach(function(it,i){ var row=document.createElement('div'); row.className='sv';
      var nm=(it.name||('디자인 '+(i+1))); nm=nm.replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});
      row.innerHTML='<b>'+nm+'</b><button data-a="load">불러오기</button><button class="svdel" data-a="del">삭제</button>';
      row.querySelector('[data-a=load]').addEventListener('click',function(){ applySnapshot(it.data); });
      row.querySelector('[data-a=del]').addEventListener('click',function(){ var a=loadStore(); a.splice(i,1); writeStore(a); renderSaved(); });
      host.appendChild(row); });
  }
  document.getElementById('save-btn').addEventListener('click',function(){
    var nameInp=document.getElementById('save-name'); var arr=loadStore();
    var name=(nameInp.value||'').trim()||('디자인 '+(arr.length+1));
    arr.push({name:name,data:snapshot(),ts:Date.now()}); writeStore(arr); nameInp.value=''; renderSaved();
  });

  loadTemplate('dashboard');
  renderSaved();
  renderBar(); render();
  window.addEventListener('resize',function(){render();});
})();
</script>
</body>
</html>
